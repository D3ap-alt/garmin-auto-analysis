name: Sleep Report

on:
  schedule:
    # JST 7:15-11:15 に毎時実行（同期待ち。レポート済みなら即終了）
    - cron: '15 22,23 * * *'
    - cron: '15 0,1,2 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '対象日 (YYYY-MM-DD, 空欄なら今日)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: sleep-report
  cancel-in-progress: false

jobs:
  sleep:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sleep report
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GARMIN_TOKENS_BASE64: ${{ secrets.GARMIN_TOKENS_BASE64 }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: python scripts/sleep_report.py

      - name: Commit sleep state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain sleep_state.json) ]]; then
            git pull --rebase
            git add sleep_state.json
            git commit -m "Update sleep report state [skip ci]"
            git push
          fi
