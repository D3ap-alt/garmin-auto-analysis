name: Repair Raw Data

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '確認のみ（何も書き込まない）'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# 毎時の本番ジョブ・backfill と push が衝突しないよう同じグループで直列化する
concurrency:
  group: garmin-analysis
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Garmin へはアクセスしない。保存済み FIT を読み直すだけ。
      - name: Repair multisport raw data
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/repair_multisport.py --dry-run
          else
            python scripts/repair_multisport.py
          fi

      - name: Commit repaired raw data
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/raw
          if ! git diff --cached --quiet; then
            git commit -m "repair multisport raw: $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "No changes to commit"
          fi
