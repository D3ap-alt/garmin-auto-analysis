name: Daily Garmin Analysis

on:
  schedule:
    # 毎日 朝7:00 JST (= 前日22:00 UTC)に実行
    - cron: '0 22 * * *'
  workflow_dispatch:  # 手動実行も可能（テスト用）

permissions:
  contents: write  # state.jsonをcommitするため

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run analysis
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GARTH_TOKENS_BASE64: ${{ secrets.GARTH_TOKENS_BASE64 }}
        run: python scripts/run_analysis.py

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain state.json) ]]; then
            git add state.json
            git commit -m "Update analyzed activity state [skip ci]"
            git push
          fi
