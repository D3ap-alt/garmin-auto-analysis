name: Garmin Analysis

on:
  schedule:
    # 1時間おきに実行（毎時00分・UTC基準。JSTでも毎時00分）
    # 新規アクティビティがなければ ~30秒で終了するので低コスト
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: '分析対象日 (YYYY-MM-DD, 空欄なら今日)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# 同時実行を防ぐ（前回実行が終わってから次を開始）
concurrency:
  group: garmin-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sleep report
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GARMIN_TOKENS_BASE64: ${{ secrets.GARMIN_TOKENS_BASE64 }}
        run: |
          H=$(TZ=Asia/Tokyo date +%H)
          if [ "$H" -ge 6 ]; then
            python scripts/sleep_report.py
          else
            echo "JST ${H}時のため睡眠レポートはスキップ（就寝中の部分データ防止）"
          fi

      - name: Run analysis
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GARMIN_TOKENS_BASE64: ${{ secrets.GARMIN_TOKENS_BASE64 }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: python scripts/run_analysis.py

      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain state.json sleep_state.json) ]]; then
            git add state.json sleep_state.json
            git commit -m "Update analyzed activity state [skip ci]"
            git pull --rebase
            git push
          fi
