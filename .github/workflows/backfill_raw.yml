name: Backfill Raw Data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日 (YYYY-MM-DD)。空欄なら今日'
        required: false
        default: ''
        type: string
      end_date:
        description: '終了日 (YYYY-MM-DD)。空欄なら開始日と同じ'
        required: false
        default: ''
        type: string
      activity_ids:
        description: 'ID直指定（カンマ区切り）。指定すると日付は無視'
        required: false
        default: ''
        type: string
      limit:
        description: '1回の上限件数（0で無制限）'
        required: false
        default: '30'
        type: string
      force:
        description: '保存済みでも再取得する'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# 毎時の本番ジョブと push が衝突しないよう同じグループで直列化する
concurrency:
  group: garmin-analysis
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill raw data
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GARMIN_TOKENS_BASE64: ${{ secrets.GARMIN_TOKENS_BASE64 }}
          BACKFILL_START: ${{ inputs.start_date }}
          BACKFILL_END: ${{ inputs.end_date }}
          BACKFILL_IDS: ${{ inputs.activity_ids }}
          BACKFILL_LIMIT: ${{ inputs.limit }}
          BACKFILL_FORCE: ${{ inputs.force && '1' || '' }}
        run: python scripts/backfill_raw.py

      - name: Commit raw data & refreshed tokens
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STAGED=0
          if [ -f garmin_token.b64 ]; then git add garmin_token.b64 && STAGED=1; fi
          if [ -d data/raw ]; then git add -A data/raw && STAGED=1; fi
          if [ "$STAGED" = "1" ] && ! git diff --cached --quiet; then
            git commit -m "backfill raw: $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "No changes to commit"
          fi
